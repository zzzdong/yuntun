name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # runner 的可用盘只有十几 GiB；本仓全量 debug 测试树（line-tables-only）约 45 GiB，
  # 不关调试信息会在链接阶段把盘写满（链接器以 lld 崩溃的形态报错）。
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: clippy + tests (stable, x86_64-gnu)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-stable
      # 0.1 起 fmt 是门禁：全仓已对齐（此前从未跑过 rustfmt，884 处差异一次性基线化）。
      # 锁文件必须与 Cargo.toml 一致：`--locked` 的失败通常在发布时才暴露，
      # 而它看起来像"构建坏了"（alpha.2 的实际翻车点）。在 CI 的每次提交上先钉住。
      - name: 锁文件（--locked）
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: rustfmt（--check）
        run: cargo fmt --all -- --check
      - name: clippy（-D warnings）
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 磁盘（诊断）
        run: df -h /
      - name: tests
        run: cargo test --workspace

  msrv:
    name: MSRV 1.95 真编译
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-msrv
      # 不是摆样子：`Cargo.toml` 里的 rust-version 是对外承诺（§188 本地已验证，
      # 这条把它钉在每次提交上）。只 check，不跑测试 —— 测试矩阵在 stable 那一份。
      - name: cargo check（MSRV）
        run: cargo check --workspace --all-targets
