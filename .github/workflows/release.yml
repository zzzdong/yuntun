name: release

# 打 tag（`v0.1.0-alpha.1`）或手动触发。四条产物：x86_64/aarch64 × gnu/musl。
# 版本号唯一来源是 `Cargo.toml`；tag 与它不一致时 build 直接失败（不发错版本）。
#
# 平台策略（2026-10-18 实测后定）：
#   - x86_64-gnu：ubuntu-24.04 原生
#   - aarch64-gnu：**ubuntu-24.04-arm 原生**（不用 cross；GitHub 公共仓库有 ARM runner）
#   - 两个 musl：x86_64 runner + musl.cc 的交叉工具链（**带 g++**：vortex 的
#     `custom-labels` 要编译 C++）
#   - 所有 job 都要装 clang/libclang：`custom-labels` 的 build.rs 用 bindgen。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 发布包不带调试信息（否则每个二进制近 1 GB）
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: ${{ matrix.target }}
    # ARM 目标用 ARM runner；其余 x86_64。musl 交叉工具链在 x86_64 上跑。
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-24.04
            musl: ""
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            musl: ""
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-24.04
            musl: x86_64-linux-musl-cross
          - target: aarch64-unknown-linux-musl
            runs-on: ubuntu-24.04
            musl: aarch64-linux-musl-cross
    steps:
      - uses: actions/checkout@v4

      - name: 版本口径（tag == Cargo.toml）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          V=$(awk '/^\[workspace.package\]/{f=1} f&&/^version = /{gsub(/"/,"",$3);print $3;exit}' Cargo.toml)
          echo "tag=$TAG workspace=$V"
          [ "$TAG" = "$V" ] || { echo "::error::tag 与 workspace 版本不一致"; exit 1; }

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}

      # vortex → custom-labels 的 build.rs：C++17 编译 + bindgen（libclang）。
      # 不装会得到 "Unable to generate bindings" / "musl-g++ not found"。
      - name: 编译依赖（clang / libclang / g++）
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev g++ make
          # 不能只信 `llvm-config --libdir`：Ubuntu 上 clang 与 libclang 的版本
          # 可能不是同一个，设错 LIBCLANG_PATH 反而让 clang-sys 找不到库。
          dir=$(find /usr/lib -maxdepth 4 -name 'libclang.so*' -printf '%h\n' 2>/dev/null | head -1)
          echo "libclang dir: ${dir:-<未找到，交给 bindgen 自己搜>}"
          if [ -n "$dir" ]; then echo "LIBCLANG_PATH=$dir" >> "$GITHUB_ENV"; fi

      # musl：musl.cc 的交叉工具链自带 g++（Ubuntu 的 musl-tools 只有 musl-gcc，
      # 而 custom-labels 需要 C++ 编译器）。
      - name: musl 交叉工具链（含 g++）
        if: matrix.musl != ''
        run: |
          set -euo pipefail
          DIR=/opt/musl
          sudo mkdir -p "$DIR"
          # 下载失败常见于 runner 到 musl.cc 的瞬时问题：重试 + 落盘后再解，错误可读
          curl -fL --retry 5 --retry-delay 3 --retry-all-errors --max-time 300 \
            "https://musl.cc/${{ matrix.musl }}.tgz" -o /tmp/musl-cross.tgz
          ls -lh /tmp/musl-cross.tgz
          sudo tar -xzf /tmp/musl-cross.tgz -C "$DIR" --strip-components=1
          case "${{ matrix.target }}" in
            x86_64-*) P=x86_64-linux-musl; T=x86_64_unknown_linux_musl ;;
            aarch64-*) P=aarch64-linux-musl; T=aarch64_unknown_linux_musl ;;
            *) echo "::error::未知 target"; exit 1 ;;
          esac
          {
            echo "CC_${T}=$DIR/bin/${P}-gcc"
            echo "CXX_${T}=$DIR/bin/${P}-g++"
            echo "AR_${T}=$DIR/bin/${P}-ar"
            echo "CARGO_TARGET_${T^^}_LINKER=$DIR/bin/${P}-gcc"
          } >> "$GITHUB_ENV"
          "$DIR/bin/${P}-g++" --version | head -1

      - name: build
        run: |
          set +e
          cargo build --locked --release --bins --target ${{ matrix.target }} 2>&1 | tee /tmp/build.log
          st=${PIPESTATUS[0]}
          if [ "$st" -ne 0 ]; then
            # 把真实错误行塞进 check-run annotation（无需登录取日志也能看到）
            tail -40 /tmp/build.log | sed 's/^/::error::/'
            exit "$st"
          fi

      - name: 打包
        run: scripts/package_release.sh --no-build --target ${{ matrix.target }}

      - name: 产物自检（版本 + 文件）
        run: |
          ls -lh "target/${{ matrix.target }}/release/"{yuntun,yuntun-cli,yuntun-datanode,metanode}
          # 原生目标（runner 架构 == target 架构）才执行；交叉产物只在包内交付
          if [ "${{ matrix.target }}" = "x86_64-unknown-linux-gnu" ] && [ "$(uname -m)" = "x86_64" ]; then
            "target/${{ matrix.target }}/release/yuntun" --version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: yuntun-${{ matrix.target }}
          path: dist/yuntun-*.tar.gz*
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 校验和汇总
        run: |
          cd dist
          cat *.sha256 | sort > SHA256SUMS
          ls -lh
      - name: 发布说明（CHANGELOG 的当前版本段）
        run: |
          V="${GITHUB_REF_NAME#v}"
          # 用 `index == 1` 精确匹配标题前缀（版本号里的 `.`/`+` 不该进正则）
          awk -v h="## [$V]" 'index($0, h) == 1 {f=1} f && index($0, "## [") == 1 && index($0, h) != 1 {exit} f' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md || { echo "::error::CHANGELOG 里没有 [$V] 段"; exit 1; }
          cat RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/SHA256SUMS
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          draft: false
          # alpha/beta/rc（tag 含 `-`）自动标成预发布，避免被当成稳定版
          prerelease: ${{ contains(github.ref_name, '-') }}
