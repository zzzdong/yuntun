[package]
name = "yuntun"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow = "57"
arrow-array = "57"
arrow-schema = "57"
arrow-flight = "57"
datafusion = "51"
datafusion-catalog = "51"
datafusion-common = "51"
datafusion-execution = "51"
datafusion-sql = "51"
object_store = "0.13"
