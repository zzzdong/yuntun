[workspace]
resolver = "3"
members = [
    "crates/model",
    "crates/proto",
    "crates/wal",
    "crates/store",
    "crates/chunk",
    "crates/format",
    "crates/catalog",
    "crates/meta",
    "crates/ingest",
    "crates/query",
    "crates/compaction",
    "crates/sql",
    "crates/sqlwire",
    "crates/server",
    "crates/client",
    "crates/testkit",
    "crates/standalone",
    "crates/chaos",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# ---- 核心 ----
# 注意：datafusion 55.0.0 实际依赖 arrow 59 / object_store 0.13（文档 §2.3 的
# "arrow 55" 指 DataFusion 主版本）。统一全 workspace 用 arrow 59 避免双版本冲突。
# 注意：`ipc_compression` 是 spill 通道的硬需求 —— 架构 §2.1 规定 spill 落盘用
# **Arrow IPC(LZ4)**（落盘/读回近乎零成本，flush 只付一次必需的编码）。默认 feature
# 不含压缩编解码，故在此显式打开（只增加编解码器，不改变语义）。
arrow = { version = "59", features = ["ipc_compression"] }
arrow-flight = { version = "59", features = ["flight-sql-experimental"] }
datafusion = "55"
datafusion-datasource = "55"
datafusion-datasource-parquet = "55"
parquet = "59"
object_store = { version = "0.13", features = ["aws"] }
url = "2"

# ---- 运行时 ----
# CLI 参数解析（全仓统一，不手写：手写的 help/错误信息/补全迟早漂移）
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tonic = "0.14"
prost = "0.14"

# ---- 工具 ----
uuid = { version = "1", features = ["v7"] }
# S1.6/S1.7：SQL 前置解析（与 DataFusion 55 同源解析器，版本对齐 Cargo.lock 的 0.62）
sqlparser = "0.62"
crc32fast = "1"
thiserror = "2"
tracing = "0.1"
async-trait = "0.1"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rand = "0.8"

# 阶段 1 才引入：
# raft-rs = "0.7"
# fjall   = "3.1.8"

[profile.release]
# 0.1 发布产物瘦身：完整调试信息会让二进制达到 2.3GB。
# line-tables-only 保留崩溃回溯的文件/行号，体积小一个量级；
# 需要完整符号做性能分析时用 CARGO_PROFILE_RELEASE_DEBUG=2 覆盖。
debug = "line-tables-only"
