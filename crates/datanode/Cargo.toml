[package]
name = "yuntun-datanode"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 数据节点进程（R4 T12.1）：`Ingestor` + 私有目录租约 + 数据面 gRPC 服务。
# 单独成 crate 的理由与 `shardrpc` 同源：**只有装配层才引入 tonic** ——
# `yuntun-ingest`（写入路径）不该为了"对外服务"而多背一项传输依赖。
[dependencies]
yuntun-model = { path = "../model" }
yuntun-catalog = { path = "../catalog" }
yuntun-wal = { path = "../wal" }
yuntun-ingest = { path = "../ingest" }
yuntun-store = { path = "../store" }
# 压缩 + 孤儿 GC 是**数据进程的第二职能**（`--compaction`），不是独立的第三类进程
yuntun-compaction = { path = "../compaction" }
yuntun-shardrpc = { path = "../shardrpc" }
# 数据节点要**入册/保活**（T12.3）：注册走 raft、心跳走内存。
# 这是装配层，tonic 到这里为止（`yuntun-ingest` 写入路径仍然干净）。
yuntun-meta = { path = "../meta" }
# 查询侧（协调者 / 只查询形态）：查询引擎 + 只读 Flight SQL 服务面 + 数据面客户端。
# `§79` 更正后它是**数据进程的一面**，不再是独立进程的依赖。
yuntun-query = { path = "../query" }
yuntun-server = { path = "../server" }
arrow-flight = { workspace = true }
futures = { workspace = true }
tonic = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# 用例要读元数据面（名录/心跳）的 proto 消息
yuntun-proto = { path = "../proto" }
yuntun-testkit = { path = "../testkit" }
# 压缩用例要写真 parquet 文件（`arrow` 已在 dev-deps 里）
yuntun-format = { path = "../format" }
arrow = { workspace = true }
