[package]
name = "yuntun-client"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "yuntun-cli"
path = "src/main.rs"

[dependencies]
# 成员变更的运维面要直接调 metanode 的 gRPC 面（`§128`）
yuntun-proto = { path = "../proto" }
# CLI 参数解析（全仓统一）
clap = { workspace = true }
# prettyprint = CLI 表格输出；csv/json = 导入解析
arrow = { workspace = true, features = ["prettyprint", "csv", "json"] }
arrow-flight = { workspace = true }
parquet = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 运维面用例要起一个**真的** metanode 服务（`§128`：验"接触点逐个试"+ 服务端拒绝原样上抛）
yuntun-meta = { path = "../meta" }
yuntun-testkit = { path = "../testkit" }
yuntun-server = { path = "../server" }
yuntun-catalog = { path = "../catalog" }
# `§174`：注入一个"读不到的来源"（假 `ShardReader`）来验 partial 标记的最后一跳
yuntun-store = { path = "../store" }
# 实现 `ShardReader` 要用同一个宏（假来源的注入点）
async-trait = { workspace = true }
yuntun-model = { path = "../model" }
tokio-util = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
