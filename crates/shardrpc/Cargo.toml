[package]
name = "yuntun-shardrpc"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
yuntun-model = { path = "../model" }
# `§179`：冷折叠要把 **schema** 过网（请求自足）⇒ 复用 format 的 IPC 编解，
# 而不是在协议两侧各写一份
yuntun-format = { path = "../format" }
yuntun-proto = { path = "../proto" }
yuntun-store = { path = "../store" }
arrow = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 对拍要真的 chunk store 当数据节点、真的查询引擎当协调者
yuntun-chunk = { path = "../chunk" }
yuntun-catalog = { path = "../catalog" }
yuntun-query = { path = "../query" }
yuntun-testkit = { path = "../testkit" }
# `§179` 的往返用例要持一个对象存储（服务端真的读文件）
object_store = { workspace = true }
