[package]
name = "yuntun-queryd"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# 查询节点进程（R4 T12.1 第二刀）：**只读**——元数据来自 metanode、热数据来自各数据节点
# 的 gRPC 数据面、冷数据来自共享对象存储；自己不持有 WAL/chunk。
[dependencies]
yuntun-model = { path = "../model" }
yuntun-catalog = { path = "../catalog" }
yuntun-meta = { path = "../meta" }
yuntun-query = { path = "../query" }
yuntun-server = { path = "../server" }
yuntun-shardrpc = { path = "../shardrpc" }
yuntun-store = { path = "../store" }
arrow-flight = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
yuntun-proto = { path = "../proto" }
arrow = { workspace = true }
