[package]
name = "yuntun-query"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
yuntun-model = { path = "../model" }
yuntun-catalog = { path = "../catalog" }
yuntun-store = { path = "../store" }
yuntun-format = { path = "../format" }
datafusion = { workspace = true }
# JSON SQL 函数（json_extract / json_get / json_is_valid 等；版本与 datafusion 对齐）
datafusion-functions-json = "0.55"
datafusion-datasource = { workspace = true }
datafusion-datasource-parquet = { workspace = true }
arrow = { workspace = true }
object_store = { workspace = true }
url = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
yuntun-testkit = { path = "../testkit" }
yuntun-ingest = { path = "../ingest" }
# 仅测试：双实例对拍需要**真的** chunk store 当两个 datanode（库本身只依赖 `ShardReader` 缝）
yuntun-chunk = { path = "../chunk" }
# 仅测试：**跨实例合并**（T14.4）要先把两边的文件真的合并掉、再查一遍 ——
# 合并绝不能改变行集（重复计数/漏读都只能靠"合并前后逐行对拍"抓住）
yuntun-compaction = { path = "../compaction" }
yuntun-wal = { path = "../wal" }
yuntun-store = { path = "../store" }
tokio-util = { workspace = true }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
