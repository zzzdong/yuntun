[package]
name = "yuntun-sql"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
yuntun-model = { path = "../model" }
yuntun-ingest = { path = "../ingest" }
yuntun-query = { path = "../query" }
yuntun-catalog = { path = "../catalog" }
yuntun-format = { path = "../format" }
# `F.3`：删除向量的对象读写（`put_bytes` / `get_bytes`）与 `Arc<dyn ObjectStore>`
yuntun-store = { path = "../store" }
object_store = { workspace = true }
arrow = { workspace = true }
arrow-cast = "59"
sqlparser = { workspace = true, features = ["visitor"] }
# `§191`：会话表的取消位（Notify）与查询执行的 select!
tokio = { workspace = true, features = ["sync", "macros"] }
# `§191`：流式查询的取消包装器（实现 `Stream`）
futures = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# 集成测试（`tests/show_tables_from.rs`）起只读引擎跑 SQL：多线程运行时
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
