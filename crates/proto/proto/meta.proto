// yuntun metanode 的 gRPC 面（S3-0）。
//
// 设计依据：docs/metanode-design.md §5（接口契约）、§6（S3-0 验收）。
//
// 三条**不能破坏**的约定（改之前先读设计）：
//
// 1. `Op` 必须**自包含**：所有时间戳/ID 都在 op 里（见下方 `Op.now_ms`），状态机 apply 时
//    **不读钟、不读环境**（否则各副本在同一串 op 上会分叉 —— S3-2 抓到过四类真实非确定性）。
// 2. **两组版本号语义不变**：DDL 推进 schema_ver、文件清单/compaction 推进 manifest_ver；
//    响应与快照必须**同时**带两者（破坏它会让查询缓存在别的节点上静默失效）。
// 3. **非 leader 的错误必须可重试**（`UNAVAILABLE` + leader hint），而不是让写入失败
//    —— G2「写入不中断」依赖这条。
//
// # 迁移进度（诚实登记）
//
// `yuntun-model` 里的请求结构是**手写普通 Rust 结构**（`ops.rs`，**不是** prost 消息），
// 所以接口面不能"直接搬字节"，必须**逐字段镜像**。本轮迁移：
//
// | op | 状态 |
// |---|---|
// | `CreateSchema` | ✅ |
// | `DropTable` | ✅ |
// | `CreateTable`（含 `partition_cols` / `ingest_config`） | ✅ |
// | `CommitFiles`（含 `FileManifest` / `StatisticsLite` / `ColumnStatLite`） | ✅（设计 §6 点名的那一项） |
// | `EvolveSchema` / `DropShard` / `Compaction` / 租约 | ⏳ 后续增量 |
//
// 未迁移的 op 目前**不进**这个 proto（而不是留个没有编解码的 `bytes` 字段 —— 那种占位会
// 让下一位实现者以为"已经有格式了"）。`wire_compat.rs` 里有一条断言分支数的用例：
// 加分支必须同时更新它，防止漏覆盖。

syntax = "proto3";

package yuntun.meta.v1;

service Meta {
  // 写：op 已提交（多数派持久化）才返回
  rpc Propose  (ProposeRequest)  returns (ProposeResponse);
  // 读：版本号 + 全量/增量载荷
  rpc Prefetch (PrefetchRequest) returns (PrefetchResponse);
  // 读：manifest_delta(since)
  rpc Delta    (DeltaRequest)    returns (DeltaResponse);
  // 运维：leader / term / 各索引 / 快照位置
  rpc Status   (StatusRequest)   returns (StatusResponse);
  // 成员变更（learner → voter）
  rpc Join     (JoinRequest)     returns (JoinResponse);
  // 节点间：一条 raft 消息（S3-3 传输）。**不是客户端接口** ——
  // 客户端用它没有意义（它只对 raft 有语义），单独列出来是为了让"哪些 RPC 是给谁的"一目了然。
  rpc Raft     (RaftRequest)     returns (RaftResponse);
}

// ---------------------------------------------------------------- 写路径

// 自描述的 op（约定 1）。
message Op {
  // 提交时刻（Unix 毫秒）。**由发起方打点**并随 op 传播 —— 状态机不读钟。
  uint64 now_ms = 1;

  oneof kind {
    CreateSchemaOp create_schema = 2;
    DropTableOp    drop_table    = 3;
    CommitFilesOp  commit_files  = 4;
    CreateTableOp  create_table  = 5;
    DropSchemaOp   drop_schema   = 6;
    EvolveSchemaOp evolve_schema = 7;
    DropShardOp    drop_shard    = 8;
    CompactionOp   compaction    = 9;
    // 幂等"认领"（写入前登记键）。**必须是 op**：认领一旦只存在本地，
    // 并发同键请求会双双通过预筛各写一份（见 pipeline.rs 的认领注释）。
    IdempotencyOp  idempotency   = 10;
  }
}

message CreateSchemaOp {
  string name = 1;
}

message DropTableOp {
  string name = 1;
}

// 与 `ops::CreateTableRequest` 逐字段对齐。
message CreateTableOp {
  string name            = 1;
  string namespace       = 2;
  // Arrow IPC 的 schema 字节（复用 `serialize_schema`，避免双重编码）
  bytes  arrow_schema_ipc = 3;
  string default_format  = 4;
  repeated string partition_cols = 5;
  // `IngestConfig`（它本身就是 prost 消息，直接带编码字节）
  bytes  ingest_config   = 6;
}

// 与 `ops::CommitFilesRequest` **逐字段对齐**（设计 §6 的 S3-0 验收项）。
message CommitFilesRequestMsg {
  string table             = 1;
  string batch_id          = 2;
  // 单键（历史字段；新写入应使用键集合）
  optional string client_request_id = 3;
  // **幂等键集合**（S3-5：一个 chunk 聚多个键，提交层按键集合去重）
  repeated string client_request_ids = 4;
  string shard             = 5;
  string time_window       = 6;
  repeated FileManifestMsg files = 7;
  uint64 schema_version    = 8;
  uint64 row_count         = 9;
}

message CommitFilesOp {
  CommitFilesRequestMsg request = 1;
}

// 与 `meta::FileManifest` 逐字段对齐（tag 与手写结构**保持一致**，便于对照阅读）。
message FileManifestMsg {
  string file_path          = 1;
  string batch_id           = 2;
  string client_request_id  = 3;
  uint64 schema_version     = 4;
  uint32 status             = 5;   // FileStatus
  uint64 valid_from         = 6;
  uint64 deleted_at         = 7;
  StatisticsLiteMsg stats   = 8;
  uint64 row_count          = 9;
  uint64 file_size          = 10;
  string table              = 11;
  string shard              = 12;
  string time_window        = 13;
  string partition_key      = 14;
  string source_instance    = 15;
  uint64 sealed_at_ms       = 16;  // 写侧封口时刻（T8 基线加的运维字段）
  uint64 committed_at_ms    = 17;  // 提交成功时刻
  string seal_reason        = 18;  // 封口原因（可观测性：为什么这个 chunk 被封）
  string seal_pressure      = 19;  // 触发的压力档位（内存/磁盘水位）
}

message StatisticsLiteMsg {
  repeated ColumnStatLiteMsg columns = 1;
}

message ColumnStatLiteMsg {
  string name      = 1;
  bytes  min       = 2;
  bytes  max       = 3;
  uint64 null_count = 4;
}

message ProposeRequest {
  Op     op         = 1;
  // 幂等：同 request_id 重复 propose 必须返回同一结果（跨进程去重靠 SM 内的幂等键）
  bytes  request_id = 2;
  // OCC：客户端读到的版本（DDL 用；不符 → FAILED_PRECONDITION，可重试）
  uint64 schema_ver = 3;
}

message ProposeResponse {
  bool   accepted     = 1;  // false = 幂等命中（不重复应用）
  uint64 revision     = 2;  // raft log index（SM 的权威位置）
  uint64 schema_ver   = 3;  // 变更后的两组版本（约定 2：必须同时给）
  uint64 manifest_ver = 4;
  // 各 op 的结果（形状与手写 Response 一致；S3-3 逐 op 定形）
  bytes  result       = 5;
  // 本次提交分配的 Catalog 快照号（读己之写用）
  uint64 snapshot     = 6;
}

// ---------------------------------------------------------------- 读路径

// 读：**版本探测 + 刷新载荷**（设计 §3.2：读不走 metanode，靠本地缓存 + 版本驱动刷新）。
//
// 载荷语义（S3-4 定形，**契约** —— 客户端的本地缓存靠它刷新）：
//
// | 请求 | 响应 |
// |---|---|
// | `tables` 为空 | 只回版本号，**载荷为空**（这就是"无变化零开销"那条路径） |
// | `tables` 非空、`full=false` | 只含**请求里存在**的表；⚠️ 请求了却不在载荷里 = **该表已删**（客户端必须删本地条目） |
// | `full=true` | **全部**表（忽略 `tables`），并置 `full_reload` |
// | `since_*` 比当前**大**（客户端版本超前：换过集群 / 被回滚） | 全量 + `full_reload` |
//
// 最后一条是**保护**：静默返回空会让客户端以为"一切照旧"，于是继续拿一份
// 不属于本集群的缓存去规划查询 —— 错得**不报错**。
message PrefetchRequest {
  uint64 since_schema_ver   = 1;
  uint64 since_manifest_ver = 2;
  bool   full               = 3;  // true = 无视 since，要全量
  // 要刷新的表（**全限定** `schema.table`）；空 = 只要版本号
  repeated string tables    = 4;
  // 客户端本地清单的快照水位：文件级增量按它算（0 = 要全量）
  uint64 since_snapshot     = 5;
}

message PrefetchResponse {
  uint64 schema_ver   = 1;
  uint64 manifest_ver = 2;
  uint64 snapshot     = 3;
  // 刷新载荷。用**消息**而不是 bytes：自描述，客户端不用再猜编码
  PrefetchPayload payload = 4;
  bool   full_reload  = 5;  // true = 客户端必须丢弃本地缓存（结构变更 / 版本超前）
}

// 刷新载荷。做成"一层壳 + repeated tables"而不是直接 `repeated TableMeta`：
// 后续要加 manifest / 文件级增量时只加字段，不动 `PrefetchResponse` 的形状。
message PrefetchPayload {
  repeated TableMeta tables = 1;
  // schema 名（**每次刷新整体替换**：删掉的 schema 必须消失，否则远端 `USE db` 还能切进去）
  repeated string namespaces = 3;
  // 文件级增量（**含墓碑**：`deleted_at > since_snapshot` 的也要发）。
  // 只发"当前可见"会让客户端永远删不掉已删文件 → 查询读到已删数据（静默）。
  repeated FileEntry files  = 2;
}

message FileEntry {
  string          batch_id = 1;  // 键（与状态机的 files 表一致）
  FileManifestMsg manifest = 2;
}

// `TableMeta` 的线上镜像（逐字段对齐 `yuntun_model::meta::TableMeta`）。
message TableMeta {
  string name                    = 1;  // 全限定 `schema.table`
  uint64 current_schema_version  = 2;
  repeated string partition_cols = 3;
  string default_format          = 4;  // "parquet" | "vortex"
  bytes  arrow_schema            = 5;  // Arrow IPC（与 CreateTableOp 同一种编码）
  // `optional`（proto3 presence）：**存在性有语义** —— `None`（"没配"）≠ 空配置
  optional bytes ingest_config   = 6;
  uint64 created_at              = 7;
  uint32 table_template          = 8;
  string namespace                = 9; // 空 = public（v1 数据兼容）
}

message DeltaRequest {
  uint64 since_manifest_ver = 1;
}

message DeltaResponse {
  uint64 schema_ver              = 1;
  uint64 manifest_ver            = 2;
  repeated string changed_tables = 3;
  bool   full_reload             = 4;
}

// ---------------------------------------------------------------- 运维

message StatusRequest {}

message StatusResponse {
  uint64 node_id       = 1;
  string role          = 2;  // leader / follower / candidate / learner
  uint64 term          = 3;
  uint64 leader_id     = 4;  // 0 = 未知（用于 leader hint）
  uint64 commit_index  = 5;
  uint64 applied_index = 6;
  // 以下三个用于回答「快照与日志的健康度」（排查「follower 追不上」的第一手信息）
  uint64 snapshot_index = 7;
  uint64 first_index    = 8;
  uint64 last_index     = 9;
  string version        = 10;
}

// ---------------------------------------------------------------- 成员

message JoinRequest {
  uint64 node_id      = 1;
  string address      = 2;
  bool   learner_only = 3;  // true = 只加为 learner（追平后再提升）
}

message JoinResponse {
  uint64 voters   = 1;
  uint64 learners = 2;
}

// ---------------------------------------------------------------- 节点间（raft 传输）

// 一条 raft 消息。
//
// **载荷是不透明 bytes**：投票/心跳/追加日志这些消息的格式由 raft-rs（`eraftpb`）定义，
// 我们在 proto 里重写一遍只会得到"两份必然漂移的定义 + 每升一次 raft 就要同步改 proto"。
// 代价是本字段不可自描述 —— 所以**版本必须随消息走**（本 crate 的 `PROTO_VERSION` 已在
// Status 里暴露，跨版本节点混跑要靠发布约束拦住，见 operation-log §50.5）。
message RaftRequest {
  // 发送方节点 id（对端据此做成员校验与观测；**不是**鉴权凭据）
  uint64 from = 1;
  // `raft::eraftpb::Message` 的 protobuf 编码
  bytes message = 2;
}

message RaftResponse {
  // 是否已交给对端的 raft 线程。
  //
  // `false` **不是**致命错误（raft 会按 tick 重发），但必须能被统计出来：
  // "永远选不出 leader"是最难查的故障，没有这个信号就只能靠猜。
  bool   delivered = 1;
  // 未交付的原因（对端未运行 / 不是成员）—— 日志与指标用
  string reason    = 2;
}

// ---------------------------------------------------------------- op 镜像（S3-4 第二批）

message DropSchemaOp {
  string name = 1;
}

// Schema 演进（OCC：`expected_version` 不符 → FAILED_PRECONDITION）。
message EvolveSchemaOp {
  string           table            = 1;
  SchemaChangeMsg  change           = 2;
  uint64           expected_version = 3;
}

// 单个 Schema 变更。
//
// **用 oneof 而不是「kind + 松散字段」**：后者允许非法组合（如 kind=AddColumn 却带 `to`），
// 而那种消息**编码成功**、只在应用时才炸 —— 属于把错误推到最晚发现。
message SchemaChangeMsg {
  oneof kind {
    // `Field` 与 `DataType` 都用 **Arrow IPC** 携带（见 `op.rs` 的说明）：
    // 复用 `CreateTableOp.arrow_schema_ipc` 那一套编码，不发明第二套。
    bytes         add_column_field_ipc = 1;
    WidenTypeMsg  widen_type           = 2;
    DropColumnMsg drop_column          = 3;
  }
}

message WidenTypeMsg {
  string column       = 1;
  // 目标类型：**单字段 schema 的 Arrow IPC**（`arrow::DataType` 没有 prost 表示，
  // 而它本身能被 schema IPC 无损表达）
  bytes  to_type_ipc  = 2;
}

message DropColumnMsg {
  string column = 1;
}

message DropShardOp {
  string table = 1;
  string shard = 2;
}

// Compaction 提交（L2）：旧批次标记删除 + 新文件 `valid_from = snapshot+1`，一次原子完成。
message CompactionOp {
  repeated string          old_batch_ids = 1;
  repeated FileManifestMsg new_files     = 2;
}

// 幂等记录（认领 / 提交后登记）。
message IdempotencyOp {
  IdempotencyRecordMsg record = 1;
}

message IdempotencyRecordMsg {
  string client_request_id = 1;
  // 空串 = 已认领、批次尚未落盘（见 `CatalogOps::record_idempotency` 的语义）
  string batch_id          = 2;
  uint64 committed_at      = 3;
}

