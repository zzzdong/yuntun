// 数据面 gRPC 面（S5-6；R4 T12.1「拆进程」的前置）。
//
// ## 为什么响应里必须有水位与 stale
//
// 契约出处 `architecture-with-chunk §4.4`：**水位随 pull 响应回来**（推送的水位必然陈旧，
// 而定界必须精确）。少了 `flushed_watermark` / `stale`，协调者就会在
// 「实例已放弃那批数据的本地副本、而自己的 manifest 还没追上」的窗口里**静默少数据** ——
// 这正是 `operation-log §63.3` 用四段断言钉住的那个错误，只是换到了网络另一侧。
//
// 远端实现**不能**用 0 冒充水位：那等于把 STALE 静默关掉（见 `ShardFetch::fetch_shard` 文档）。
syntax = "proto3";

package yuntun.shard.v1;

service ShardFetch {
  // 枚举某表当前存在于该实例上的分片。
  rpc FetchShards (FetchShardsRequest) returns (FetchShardsResponse);
  // 拉单个分片对 `known_manifest_ver` 尚不可冷读的数据（+ 边界信息）。
  rpc FetchShard (FetchShardRequest) returns (FetchShardResponse);
  // **实例级**水位：与"有没有分片"无关 —— 分片枚举为空时它依然必须能答。
  //
  // 为什么单独一个 RPC：实测发现把水位当成分片的派生量会**静默丢数据** ——
  // 实例已放弃某批副本后，分片枚举恰好为空（副本没了），于是"没有分片"被误当成
  // "没有已放弃的数据"（`operation-log §67`，由 `shardrpc` 的往返用例当场抓到）。
  rpc FetchWatermark (FetchWatermarkRequest) returns (FetchWatermarkResponse);
  // **聚合拉取**（`§173`，G.2 / 归档 `S5-3`）：把"可分解且精确"的聚合下推到**数据所在处**算，
  // 只回**部分状态（标量）**，绝不回原始行。
  //
  // 为什么单独一条 RPC 而不是给 `FetchShard` 加参数：响应类型不同（行 ≠ 标量），
  // 混在一个响应里就会出现"两个字段只有一个有意义"的形状 —— 那是可以误用的契约。
  // 边界（哪几种聚合能下推、为什么浮点不行）写在 `yuntun_model::agg` 的模块文档里。
  rpc FetchShardAggs (FetchShardAggsRequest) returns (FetchShardAggsResponse);
}

// 一个要算的聚合（`§173`）。
message AggSpecMsg {
  // 0 = count(*) / 1 = count(col) / 2 = sum(col) / 3 = min(col) / 4 = max(col)
  uint32 kind   = 1;
  // `count(*)` 时为空
  string column = 2;
}

message FetchShardAggsRequest {
  // 全限定表名 `schema.table`。
  //
  // 为什么是**表级**而不是分片级：一次查询要的就是"这个来源对这张表的贡献"，
  // 逐分片发会变成 N 次 RPC（而聚合的收益本来就在"少传数据"上，多几跳就把收益吃掉了）。
  string table = 1;
  // 调用方所依据的 manifest 版本（= 它那次查询的 Catalog 快照号）
  uint64 known_manifest_ver = 2;
  // 与行级拉取**同一把栅栏**（语义见 `FetchShardRequest.known_batch_ids`）：
  // 属于这些批次的热副本不得再算一次，否则同一批数据会被算两遍。
  repeated string known_batch_ids = 3;
  // 与响应里的 `partials` **按下标一一对应**（顺序是契约的一部分）。
  repeated AggSpecMsg aggs = 4;
}

// 一个聚合的部分状态。
//
// 用"显式的 has_* 标志"而不是 `optional`：proto3 的 `optional` 在跨语言/跨版本上更绕，
// 而这里要表达的语义很硬 —— **NULL 与 0 必须能分开**（空集 `sum` 是 NULL，不是 0）。
message PartialAggMsg {
  // 0 = count / 1 = sum(int) / 2 = min / 3 = max（用于自查"两边说的是同一件事"）
  uint32 kind = 1;
  uint64 count = 2;
  // sum：`has_sum = false` ⇒ NULL（空集或全 NULL 列）
  bool has_sum = 3;
  int64 sum    = 4;
  // min/max：`has_scalar = false` ⇒ NULL；`scalar_is_text` 决定读哪个字段
  bool has_scalar   = 5;
  int64 scalar_int  = 6;
  string scalar_text = 7;
  bool scalar_is_text = 8;
}

message FetchShardAggsResponse {
  // 与请求 `aggs` **同序同长**（长度不符 = 协议错，调用方应当报错而不是猜）
  repeated PartialAggMsg partials = 1;
  uint64 flushed_watermark = 2;
  // 与行级拉取同一语义：`known_manifest_ver < flushed_watermark` ⇒ 本次可能不完整，
  // 而且**聚合比行更危险**（少一个来源 = 计数偏小却看起来像个正常数字）
  bool stale = 3;
}

message ShardIdMsg {
  // 全限定表名 `schema.table`
  string table = 1;
  string shard = 2;
  // 时间窗口（整分钟对齐）
  string window = 3;
}

message FetchShardsRequest {
  string table = 1;
}

message FetchShardsResponse {
  repeated ShardIdMsg shards = 1;
}

message FetchWatermarkRequest {
  // 调用方所依据的 manifest 版本（只用于判定 stale）
  uint64 known_manifest_ver = 1;
}

message FetchWatermarkResponse {
  uint64 flushed_watermark = 1;
  bool stale = 2;
}

message FetchShardRequest {
  ShardIdMsg shard = 1;
  // 调用方所依据的 manifest 版本（= 它那次查询的 Catalog 快照号）
  uint64 known_manifest_ver = 2;
  // **调用方已经能读到的批次**（它那份 manifest 快照里可见文件的 `batch_id`）。
  //
  // 语义是**栅栏**：属于这些批次的本地热副本不得再回一次 —— 否则在
  // 「commit_files 成功 → 调用方 mark_committed」的窗口里，同一批数据会**同时**
  // 从"已提交文件"与"热数据"被读到（重复计数，`operation-log §28.1`）。
  // 服务端**只按调用方给的这个集合过滤**，不自行推断（`read_shard_excluding` 文档）。
  repeated string known_batch_ids = 3;
}

message FetchShardResponse {
  // 每批一个 arrow IPC stream —— **与 WAL 记录 / spill 同一种编码**：
  // 批次在系统里只该有一种线上形态，否则就多一处会漂移的编解码。
  repeated bytes batches_ipc = 1;
  // 本实例已 flush **且已放弃本地副本**的最高 manifest 版本（单调不回退，`§63.2`）
  uint64 flushed_watermark = 2;
  // `known_manifest_ver < flushed_watermark` ⇒ 本次结果可能不完整：
  // 调用方必须刷新 manifest 后用新版本重试，**不得**当作完整答案
  bool stale = 3;
}
