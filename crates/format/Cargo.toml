[package]
name = "yuntun-format"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# ADR-1: Vortex 主格式 + Parquet 回退（FormatSwitch）。
# `§164`：**Vortex 已是默认**（feature 默认开）—— Parquet 退为"回退 / 兼容既有部署"的格式。
# 仍然保留 feature 开关：`--no-default-features` 可编出不带 vortex 的二进制
# （那时 `default_format = "vortex"` 会在**启动自检**里就报出来，见 `Config::warnings`）。
[features]
default = ["vortex"]
# `§133`：**不再锁 Git commit**（ADR-1 原方案）⇒ 改用 **crates.io 的 0.86**。
# 理由很硬：0.84/0.85 用 arrow **58**，只有 **0.86** 用 arrow **59.2+**、
# 才与 datafusion 55 同代（`§130` 实测：`cargo add vortex` 会被 MSRV 逼着退到 0.84 ⇒ 两代 arrow）。
vortex = ["dep:vortex"]

[dependencies]
yuntun-model = { path = "../model" }
yuntun-store = { path = "../store" }
arrow = { workspace = true }
parquet = { workspace = true }
object_store = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
# Vortex 主格式（`§133`）：**可选** —— 默认仍是 Parquet 回退路径。
# 0.86 与 arrow 59 同代，这才让"两次编码互不串味"这件事第一次有可能成立。
vortex = { version = "0.86", optional = true }
uuid = { workspace = true }
serde = { workspace = true }
bytes = { workspace = true }
