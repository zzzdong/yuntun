[package]
name = "yuntun-chaos"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yuntun-model = { path = "../model" }
yuntun-wal = { path = "../wal" }
yuntun-store = { path = "../store" }
yuntun-format = { path = "../format" }
yuntun-catalog = { path = "../catalog" }
yuntun-ingest = { path = "../ingest" }
yuntun-query = { path = "../query" }
yuntun-compaction = { path = "../compaction" }
arrow = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
# T8 RowGroup 实测：读 parquet footer 数 RowGroup，而不是假设"默认值应该是几"
parquet = { workspace = true }

[dev-dependencies]
# 示例（bench/bench_baseline）的参数解析
clap = { workspace = true }
yuntun-testkit = { path = "../testkit" }
# 探针需要直接观察 chunk 层的可见性判定（提交→标记窗口）
yuntun-chunk = { path = "../chunk" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
