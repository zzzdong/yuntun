[package]
name = "yuntun-meta"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
# 显式命名：进程名 `metanode` 是**对外接口**（编排脚本/测试用 CARGO_BIN_EXE_metanode 引用它），
# 别让它跟着包名（yuntun-meta）变。
name = "metanode"
path = "src/main.rs"

[dependencies]
yuntun-model = { path = "../model" }
yuntun-catalog = { path = "../catalog" }
arrow = { workspace = true }
# gRPC 面（S3-0）：op 类型与错误码映射
yuntun-proto = { path = "../proto" }
# `CatalogOps` 是 async trait（用 `#[async_trait]` 桥接）
async-trait = { workspace = true }
clap = { workspace = true }
prost = { workspace = true }
tonic = { workspace = true }
# gRPC 服务层：tokio 运行时 + futures（把 accept 循环包成 Stream）
tokio = { workspace = true }
futures = { workspace = true }
# S3-1 PoC（选型闸门）：raft-rs 是**候选实现**，选型结论见 docs/metanode-design.md §4.2
# 与 docs/operation-log.md §40。若最终选 openraft，换的是本 crate 的内部实现，
# 对 `CatalogState`（状态机）与上层接口无影响 —— 这正是先做 S3-2 的原因。
raft = "0.7"
# `ConfChange::merge_from_bytes` 需要 protobuf 的 Message trait（raft-rs 0.7 默认 protobuf 编解码）
protobuf = "2"
# raft 的 `Snapshot::set_data` / `get_data` 用 `Bytes`
bytes = { workspace = true }
# S3-3：metanode 的落盘存储（键值 + 原子批 + fsync）
fjall = "3"
slog = "2"

[dev-dependencies]
# 集成测试要自己构造 proto op 与 arrow schema（它们不在 crate 的公开 API 里）
arrow = { workspace = true }
prost = { workspace = true }
yuntun-model = { path = "../model" }
yuntun-proto = { path = "../proto" }
tonic = { workspace = true }
tokio = { workspace = true }
