[package]
name = "yuntun-meta"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
yuntun-model = { path = "../model" }
yuntun-catalog = { path = "../catalog" }
arrow = { workspace = true }
# S3-1 PoC（选型闸门）：raft-rs 是**候选实现**，选型结论见 docs/metanode-design.md §4.2
# 与 docs/operation-log.md §40。若最终选 openraft，换的是本 crate 的内部实现，
# 对 `CatalogState`（状态机）与上层接口无影响 —— 这正是先做 S3-2 的原因。
raft = "0.7"
# `ConfChange::merge_from_bytes` 需要 protobuf 的 Message trait（raft-rs 0.7 默认 protobuf 编解码）
protobuf = "2"
# raft 的 `Snapshot::set_data` / `get_data` 用 `Bytes`
bytes = { workspace = true }
slog = "2"
